name: Acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -I tools/verify_testdata.py .
      - run: npm run eval && git diff --exit-code -- eval/report.md
      - run: docker build --target test -t ap-agent:test .
      - run: docker compose run --build --rm ap eval
      - run: scripts/clean-room.sh
